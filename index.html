<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Menu Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
            text-align: center;
        }
        nav {
            margin-bottom: 30px;
        }
        nav a {
            text-decoration: none;
            color: #333;
            padding: 10px 20px;
            border: 1px solid #ccc;
            background-color: #fff;
            border-radius: 5px;
            font-weight: bold;
        }
        nav a:hover {
            background-color: #e0e0e0;
        }
        .image-container {
            margin-top: 20px;
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <h1>Welcome to My Website</h1>
    
    <nav>
        <!-- This link scrolls down to the image section -->
        <a href="#target-image">View Featured Image</a>
    </nav>

    <div class="image-container" id="target-image">
        <h2>Featured Image</h2>
        <!-- Replace the src URL with your actual image file path -->
        <img src="https://picsum.photos" alt="Placeholder beautiful scenery">
    </div>

</body>
</html>
