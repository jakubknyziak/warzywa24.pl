<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sklep Galeria</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&display=swap');
        
        body { font-family: 'Inter', system-ui, sans-serif; }
        .header-font { font-family: 'Playfair Display', sans-serif; }

        .product-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .product-card:hover {
            transform: translateY(-12px);
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        }
        .hero-bg {
            background: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.55)), url('https://picsum.photos/id/1015/2000/800') center/cover no-repeat;
        }
    </style>
</head>
<body class="bg-gray-50">

    <!-- Navbar -->
    <nav class="bg-white border-b sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-6 py-5 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gradient-to-br from-purple-600 to-pink-500 rounded-2xl flex items-center justify-center text-white text-2xl">🛍️</div>
                <div>
                    <h1 class="header-font text-3xl font-bold tracking-tight text-gray-900">Sklep Galeria</h1>
                    <p class="text-xs text-gray-500 -mt-1">Biżuteria • Delikatność • Styl</p>
                </div>
            </div>
            
            <div class="flex items-center gap-8 text-sm">
                <a href="#" class="hover:text-purple-600 transition-colors font-medium">Wszystkie</a>
                <a href="#" class="hover:text-purple-600 transition-colors font-medium">Naszyjniki</a>
                <a href="#" class="hover:text-purple-600 transition-colors font-medium">Kolczyki</a>
                <a href="#" class="hover:text-purple-600 transition-colors font-medium">Pierścionki</a>
                <a href="#" class="hover:text-purple-600 transition-colors font-medium">Bransoletki</a>
            </div>

            <div class="flex items-center gap-6">
                <button class="text-gray-700 hover:text-black"><i class="fa-solid fa-magnifying-glass text-xl"></i></button>
                <button class="text-gray-700 hover:text-black"><i class="fa-solid fa-heart text-xl"></i></button>
                <button class="text-gray-700 hover:text-black relative">
                    <i class="fa-solid fa-bag-shopping text-xl"></i>
                    <span class="absolute -top-1 -right-1 bg-purple-600 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center">0</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Hero -->
    <header class="hero-bg h-[420px] flex items-center text-white">
        <div class="max-w-4xl mx-auto text-center px-6">
            <h2 class="text-6xl header-font font-bold mb-4 tracking-tighter">Biżuteria, która opowiada historie</h2>
            <p class="text-xl max-w-md mx-auto opacity-90">Delikatne detale • Ponadczasowa elegancja</p>
        </div>
    </header>

    <!-- Products Grid -->
    <section class="max-w-7xl mx-auto px-6 py-16">
        <h2 class="text-4xl header-font font-semibold tracking-tight mb-10">Kolekcja biżuterii</h2>

        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-8">

            <!-- Produkt 1 (Twój lokalny plik) -->
            <div class="product-card bg-white rounded-3xl overflow-hidden border border-gray-100">
                <div class="aspect-square bg-gray-100 relative overflow-hidden">
                    <img src="image1.png" alt="Produkt 1" class="w-full h-full object-cover hover:scale-105 transition-transform duration-500">
                </div>
                <div class="p-5 text-center">
                    <h3 class="font-medium text-lg text-gray-900">Lunar Whisper</h3>
                    <p class="text-sm text-gray-500 mt-1">Naszyjnik z perłą i księżycowym kamieniem</p>
                    <div class="mt-4 text-xl font-semibold">289 zł</div>
                </div>
            </div>

            <!-- Kolejne produkty z picsum + wymyślone nazwy biżuterii -->
            <div class="product-card bg-white rounded-3xl overflow-hidden border border-gray-100">
                <div class="aspect-square bg-gray-100 relative overflow-hidden">
                    <img src="https://picsum.photos/id/201/600/600" alt="Kolczyki" class="w-full h-full object-cover hover:scale-105 transition-transform duration-500">
                </div>
                <div class="p-5 text-center">
                    <h3
