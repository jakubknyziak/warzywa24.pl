<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sklep Galeria</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0f1e, #1a1a2e);
            color: #eee;
            min-height: 100vh;
        }

        /* Górny pasek */
        header {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 1.2rem 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #fff;
        }

        .koczkodan {
            font-size: 1.4rem;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .koczkodan:hover {
            transform: scale(1.2) rotate(10deg);
        }

        /* Główna galeria */
        main {
            padding: 3rem 5%;
            max-width: 1600px;
            margin: 0 auto;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            padding: 1rem 0;
        }

        /* Karta produktu */
        .product {
            background: #16213e;
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .product:hover {
            transform: translateY(-15px) scale(1.03);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .product img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .product:hover img {
            transform: scale(1.08);
        }

        .info {
            padding: 1.5rem;
            text-align: center;
        }

        .info h3 {
            margin-bottom: 0.8rem;
            font-size: 1.4rem;
            color: #fff;
        }

        .price {
            font-size: 1.5rem;
            font-weight: 700;
            color: #00ff9d;
            margin: 0.5rem 0;
        }

        /* Responsywność */
        @media (max-width: 1200px) {
            .gallery { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 768px) {
            .gallery { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 480px) {
            .gallery { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">Sklep Galeria</div>
        <div class="koczkodan" title="Kliknij mnie!">🐵</div>
    </header>

    <main>
        <h1 style="text-align: center; margin-bottom: 2.5rem; font-size: 2.8rem; color: #fff;">
            Nasze produkty ✨
        </h1>
        
        <div class="gallery">
            <!-- Produkt 1 -->
            <div class="product">
                <img src="image1.png" alt="Eixuslnir Eixulsnir">
                <div class="info">
                    <h3>Eixuslnir Eixulsnir</h3>
                    <div class="price">299 zł</div>
                    <p style="color:#aaa; font-size:0.95rem;">Limitowana edycja • Bardzo kozackie</p>
                </div>
            </div>

            <!-- Możesz dodawać kolejne produkty kopiując blok powyżej -->
            <div class="product">
                <img src="https://picsum.photos/id/1015/600/800" alt="Produkt 2">
                <div class="info">
                    <h3>Drugi produkt</h3>
                    <div class="price">449 zł</div>
                    <p style="color:#aaa; font-size:0.95rem;">Super jakość</p>
                </div>
            </div>

            <div class="product">
                <img src="https://picsum.photos/id/201/600/800" alt="Produkt 3">
                <div class="info">
                    <h3>Trzeci produkt</h3>
                    <div class="price">199 zł</div>
                    <p style="color:#aaa; font-size:0.95rem;">Hit sezonu</p>
                </div>
            </div>

            <!-- Dodaj więcej produktów w ten sam sposób -->
        </div>
    </main>

    <script>
        // Zabawny koczkodan
        document.querySelector('.koczkodan').addEventListener('click', () => {
            const messages = [
                "uff... ooooo aaaaa...",
                "ja nie wiem... 🐵",
                "wypuszczone uff z ust powietrza...",
                "koczkodan approved 👍"
            ];
            const random = messages[Math.floor(Math.random() * messages.length)];
            alert(random);
        });
    </script>
</body>
</html>
