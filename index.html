<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kolekcja DVD - Galeria</title>
  <link rel="stylesheet" href="style.css">
  <!-- Biblioteka Fancybox do powiększania zdjęć po kliknięciu -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.css"/>
</head>
<body>
  <header>
    <h1>Kolekcja Filmów DVD (98 szt.)</h1>
    <nav>
      <a href="index.html" class="active">Galeria</a> | 
      <a href="cennik.html">Spis i Ewidencja</a>
    </nav>
  </header>

  <main>
    <div id="gallery" class="grid-container"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.umd.js"></script>
  <script>
    fetch('data.json')
      .then(response => response.json())
      .then(data => {
        const gallery = document.getElementById('gallery');
        data.forEach(item => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <a href="DVD/${item.img}" data-fancybox="gallery" data-caption="${item.title} (${item.gbp} / ${item.pln})">
              <img src="ico/${item.thumb}" alt="${item.title}" loading="lazy">
            </a>
            <p>${item.title}</p>
          `;
          gallery.appendChild(card);
        });
        Fancybox.bind("[data-fancybox]", {});
      });
  </script>
</body>
</html>
